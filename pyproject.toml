[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "fisheries-data-mcp"
version = "0.1.0"
description = "Local MCP server for reproducible fisheries and marine data queries"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mcp>=2,<3",
  "copernicusmarine>=2.0.1,<3",
  "python-dotenv>=1,<2",
]

[project.scripts]
fisheries-data-mcp = "fisheries_data_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
